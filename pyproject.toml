[project]
name = "authentication"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maryamdevz", email = "maryam22.04@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.163.1",
    "jwt>=1.4.0",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
